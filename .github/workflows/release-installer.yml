name: Build Installers

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish installer (net48, WPF)
        shell: pwsh
        run: |
          dotnet publish installer/windows/SwitchWakerHD.Installer.csproj `
            --configuration Release `
            -p:Version=$("${{ github.ref_name }}" -replace '^v','') `
            --output installer/bin `
            --nologo

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer/bin/SwitchWakerHD-Installer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SwitchWakerHD-Installer.exe" | Out-File -Encoding ascii installer/bin/SwitchWakerHD-Installer.exe.sha256
          Write-Host "SHA256: $hash"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/bin/SwitchWakerHD-Installer.exe
            installer/bin/SwitchWakerHD-Installer.exe.sha256

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish installer (.NET 8, Avalonia, one self-contained file)
        run: |
          dotnet publish installer/linux/SwitchWakerHD.Installer.Linux.csproj \
            --configuration Release \
            -p:Version="${GITHUB_REF_NAME#v}" \
            --output installer/bin-linux \
            --nologo
          mv installer/bin-linux/SwitchWakerHD-Installer installer/bin-linux/SwitchWakerHD-Installer-linux-x64
          chmod +x installer/bin-linux/SwitchWakerHD-Installer-linux-x64

      - name: Compute SHA256
        run: |
          cd installer/bin-linux
          sha256sum SwitchWakerHD-Installer-linux-x64 > SwitchWakerHD-Installer-linux-x64.sha256
          cat SwitchWakerHD-Installer-linux-x64.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/bin-linux/SwitchWakerHD-Installer-linux-x64
            installer/bin-linux/SwitchWakerHD-Installer-linux-x64.sha256
