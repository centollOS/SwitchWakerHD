name: Build Installers (Windows, macOS, Linux)

on:
  release:
    types: [published]
  # By hand on any branch, to try an installer change before a release: the .exe, the Mac zips and the Linux archives are run artifacts
  workflow_dispatch:

permissions:
  contents: write
  # SignPath reads the unsigned .exe from this run's artifacts
  actions: read

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "release") { "${{ github.ref_name }}" -replace '^v','' } else { "0.0.0" }
          "value=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Publish installer (net48, WPF)
        shell: pwsh
        run: |
          dotnet publish installer/windows/SwitchWakerHD.Installer.csproj `
            --configuration Release `
            -p:Version=${{ steps.version.outputs.value }} `
            --output installer/bin `
            --nologo

      # Signing (docs/code-signing-plan.md): only once the SignPath settings exist in the repository; until then the
      # .exe goes out unsigned, as before. The signed .exe replaces the unsigned one before the SHA256.
      - name: Upload the unsigned installer for signing
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: SwitchWakerHD-Installer-unsigned
          path: installer/bin/SwitchWakerHD-Installer.exe
          if-no-files-found: error

      - name: Sign with SignPath (waits for the approval)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ github.event_name == 'release' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installer/signed
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item installer/signed/SwitchWakerHD-Installer.exe installer/bin/SwitchWakerHD-Installer.exe -Force
          $sig = Get-AuthenticodeSignature installer/bin/SwitchWakerHD-Installer.exe
          Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          # test-signing (runs by hand) uses a test certificate Windows does not trust: only a release must be Valid
          if ("${{ github.event_name }}" -eq "release" -and $sig.Status -ne 'Valid') { throw "the signed installer's signature is $($sig.Status)" }

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer/bin/SwitchWakerHD-Installer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SwitchWakerHD-Installer.exe" | Out-File -Encoding ascii installer/bin/SwitchWakerHD-Installer.exe.sha256
          Write-Host "SHA256: $hash"

      - name: Upload as a run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchWakerHD-Installer
          path: |
            installer/bin/SwitchWakerHD-Installer.exe
            installer/bin/SwitchWakerHD-Installer.exe.sha256

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/bin/SwitchWakerHD-Installer.exe
            installer/bin/SwitchWakerHD-Installer.exe.sha256

  # The macOS installer (installer/desktop, Avalonia): one .app per architecture, signed ad hoc (installer/build-mac.sh)
  build-mac-installer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the apps (Apple Silicon and Intel)
        run: |
          version=${{ github.event_name == 'release' && github.ref_name || '0.0.0' }}
          DOTNET=dotnet installer/build-mac.sh "$version"

      - name: Upload as a run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchWakerHD-Installer-macOS
          path: |
            installer/bin/SwitchWakerHD-Installer-macOS-*.zip
            installer/bin/SwitchWakerHD-Installer-macOS-*.zip.sha256

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/bin/SwitchWakerHD-Installer-macOS-*.zip
            installer/bin/SwitchWakerHD-Installer-macOS-*.zip.sha256

  # The Linux installer (installer/desktop, Avalonia): one self-contained file per architecture (installer/build-linux.sh)
  build-linux-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the installers (x86-64 and arm64)
        run: |
          version=${{ github.event_name == 'release' && github.ref_name || '0.0.0' }}
          DOTNET=dotnet installer/build-linux.sh "$version"

      - name: Upload as a run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchWakerHD-Installer-Linux
          path: |
            installer/bin/SwitchWakerHD-Installer-linux-*.tar.gz
            installer/bin/SwitchWakerHD-Installer-linux-*.tar.gz.sha256

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/bin/SwitchWakerHD-Installer-linux-*.tar.gz
            installer/bin/SwitchWakerHD-Installer-linux-*.tar.gz.sha256
