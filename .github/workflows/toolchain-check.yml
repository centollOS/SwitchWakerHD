# (this fork) The pinned devkitPro toolchain (tools/toolchain/lock.json, docs/pinned-toolchain-plan.md): every
# week, download every locked file from devkitPro's server and ziglang.org and check its SHA-256. A failure means
# a file was removed or changed: the players' installs would stop at the Switch tools step until the lock moves
# to files that exist (a reviewed change, tested on the console).
name: Pinned toolchain check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Download and check every locked file
        run: python -I tools/toolchain/fetch.py --check --platform all
