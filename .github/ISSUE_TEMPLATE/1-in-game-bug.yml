name: In-game bug
description: Something goes wrong while playing (graphics, gameplay, sound, controls, crash during play).
labels: ["bug", "in-game"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A **save state** made where the problem happens (`slotN.wwstate`, a few KB) plus your **save file** (`cking.sav`) lets us reproduce it much faster, so please add them if you can.

        If a maintainer closed your issue and the problem comes back, comment `/reopen` on it (as the person who opened it) and it reopens automatically.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead. Screenshots or a short video help a lot (the console's Capture button works).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game, and what you did right before it happened.
      placeholder: |
        1. Go to ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: savefile
    attributes:
      label: Save state and save file, or why you can't add them
      description: |
        **Please attach a save state and your save file** (they only hold your progress and position, a few KB each):
        1. Go to where the problem happens, hold **Minus** to open the options menu and save a state in the **Saves** tab. This writes `slotN.wwstate`.
        2. Copy both files from the SD card (in the computer, or over USB with hekate's *Tools → USB Tools → SD Card*):
           - the state: `sdmc:/switch/wwhd/states/slotN.wwstate`
           - the save file: `sdmc:/switch/wwhd/save/user/cking.sav`
        3. Zip both files and drag the zip into this box.

        Also say where you were and what you did (island or dungeon, room, which file slot).
        If you can't add the files, write the reason here instead.
      placeholder: "state.zip attached (slot1.wwstate + cking.sav), file 1, standing at ... or: no files because ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.4.1, shown in the options menu's About tab), or the commit if you built it yourself (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Console mode
      options:
        - Handheld
        - Docked
        - Both
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Console and setup
      description: Console model, firmware and Atmosphère version, and the CPU/GPU clocks if you changed them in the options menu.
      placeholder: "e.g. Switch OLED, 19.0.1, Atmosphère 1.8.0, stock clocks"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The newest `wwhd_<date>_<time>.log` from `sdmc:/switch/wwhd/logs/`. If the game crashed, also the newest report from `sdmc:/atmosphere/crash_reports/`. Drag the files in here.
