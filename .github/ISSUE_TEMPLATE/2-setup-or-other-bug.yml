name: Setup, start or other bug
description: The build or install fails, the game doesn't start, or a problem outside of playing (SD card layout, forwarder, shader cache).
labels: ["bug", "setup"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For problems **while playing**, please use the "In-game bug" form instead (it asks for your save file).

        If a maintainer closed your issue and the problem comes back, comment `/reopen` on it (as the person who opened it) and it reopens automatically.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, and the exact error message (screenshot or text).
      placeholder: |
        1. Go to ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.4.1), or the commit if you built it yourself (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it fails
      options:
        - Building on the computer
        - Installing / copying to the SD card
        - Starting the game on the Switch
        - Other
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Console and computer
      description: Console model, firmware and Atmosphère version; for build problems also the computer's OS.
      placeholder: "e.g. Switch v2, 19.0.1, Atmosphère 1.8.0; macOS 15"
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: How you start the game
      options:
        - HOME-screen icon (forwarder)
        - Homebrew Menu in title mode (holding R)
        - Homebrew Menu from the album
        - Not relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The newest `wwhd_<date>_<time>.log` from `sdmc:/switch/wwhd/logs/`; if the game crashed, also the newest report from `sdmc:/atmosphere/crash_reports/`; for build problems, the terminal output. Drag the files in here.
